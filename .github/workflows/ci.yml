name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bde
          POSTGRES_PASSWORD: bde
          POSTGRES_DB: bde_mingo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bde -d bde_mingo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        credentials:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_TOKEN }}

    env:
      DATABASE_URL: postgres://bde:bde@localhost:5432/bde_mingo_test
      DATABASE_URL_TEST: postgres://bde:bde@localhost:5432/bde_mingo_test
      API_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build web
        run: pnpm --filter web build

      - name: Generated files are up to date
        run: |
          pnpm api:types
          pnpm db:generate
          git diff --exit-code || {
            echo "::error::Fichiers générés obsolètes : lance 'pnpm api:types' et 'pnpm db:generate', puis commite."
            exit 1
          }
          test -z "$(git status --porcelain)" || {
            git status --porcelain
            echo "::error::Une migration manque : lance 'pnpm db:generate' et commite le SQL."
            exit 1
          }

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
