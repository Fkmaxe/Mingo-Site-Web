# Production : un seul fichier, à lancer sur le serveur.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   (ou COMPOSE_FILE=docker-compose.prod.yml dans .env, puis simplement `docker compose up -d --build`)
#
# Le site (web) écoute sur WEB_BIND:WEB_PORT. La base et l'API ne sont jamais exposées.
# - Reverse proxy sur une autre machine (Nginx Proxy Manager…) : WEB_BIND = IP de cette machine,
#   et le proxy envoie vers http://<cette IP>:3000.
# - Reverse proxy sur cette machine : WEB_BIND=127.0.0.1 (défaut).
# - Pas de reverse proxy : COMPOSE_PROFILES=caddy et DOMAIN=… ; Caddy fait le HTTPS sur 80/443.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
      POSTGRES_DB: ${POSTGRES_DB:-bde_mingo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bde} -d ${POSTGRES_DB:-bde_mingo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-bde}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bde_mingo}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_URL: http://api:3001
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # Sauvegarde quotidienne de la base (pg_dump) et des photos (tar), 14 jours gardés, dans
  # ./backups : à recopier hors du serveur.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-bde}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-bde_mingo}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          file="/backups/bde-$$(date +%Y-%m-%d).dump"
          if pg_dump -Fc -f "$$file.tmp"; then
            mv "$$file.tmp" "$$file"
            echo "Sauvegarde écrite : $$file"
          else
            rm -f "$$file.tmp"
            echo "Sauvegarde en échec" >&2
          fi
          tar -czf "/backups/photos-$$(date +%Y-%m-%d).tar.gz" -C /uploads . \
            && echo "Photos sauvegardées" || echo "Sauvegarde des photos en échec" >&2
          find /backups \( -name 'bde-*.dump' -o -name 'photos-*.tar.gz' \) -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

  # Seulement sans reverse proxy existant : COMPOSE_PROFILES=caddy.
  caddy:
    image: caddy:2.10-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
