services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bde}
      POSTGRES_DB: ${POSTGRES_DB:-bde_mingo}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bde} -d ${POSTGRES_DB:-bde_mingo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interface web
    profiles: ["dev"]

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-bde}:${POSTGRES_PASSWORD:-bde}@db:5432/${POSTGRES_DB:-bde_mingo}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # .env's PORT is the API's.
      PORT: "3000"
      API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  db-data:
